name: build-windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Python tests
        run: python -m unittest discover -s python/tests -v

      - name: Frontend build
        run: npm run build

      - name: Sidecar IPC regression tests
        run: node --test "tests/*.test.cjs"

      - name: Build Python sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Packaged sidecar smoke test
        run: python scripts/check-sidecar.py src-tauri/binaries/signal-desk-agent-x86_64-pc-windows-msvc.exe

      - name: Generate Tauri updater placeholder notice
        shell: pwsh
        run: |
          if ((Get-Content src-tauri/tauri.conf.json -Raw) -match 'REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY') {
            Write-Host 'INFO: Release signing keys are not configured in this scaffold. Production release must replace the updater public key and add the private key secret.'
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Tauri dependency check
        run: npm run tauri info

      - name: Build Tauri app
        run: npm run tauri build -- --ci --config src-tauri/tauri.dev-build.conf.json

      - name: Verify app does not open a console
        run: python scripts/check-windows-subsystem.py src-tauri/target/release/signal-desk.exe

      - name: Prepare Windows portable package
        shell: pwsh
        run: |
          $portable = "portable\Signal Desk"

          New-Item -ItemType Directory -Force -Path $portable | Out-Null

          Copy-Item `
            "src-tauri\target\release\signal-desk.exe" `
            "$portable\signal-desk.exe" `
            -ErrorAction Stop

          Copy-Item `
            "src-tauri\binaries\signal-desk-agent-x86_64-pc-windows-msvc.exe" `
            "$portable\signal-desk-agent.exe" `
            -ErrorAction Stop

          Write-Host "Portable package prepared:"
          Get-ChildItem $portable -Recurse

      - name: Create Windows portable ZIP
        shell: pwsh
        run: |
          if (Test-Path "portable\Signal Desk") {
            Compress-Archive `
              -Path "portable\Signal Desk" `
              -DestinationPath "Signal-Desk-Portable.zip" `
              -Force

            Write-Host "Portable ZIP created:"
            Get-Item "Signal-Desk-Portable.zip"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signal-desk-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload Windows portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signal-desk-windows-portable
          path: Signal-Desk-Portable.zip
          if-no-files-found: error

      - name: Publish versioned portable release and update notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; bump package version to publish another update."
            exit 0
          }
          gh release create $tag Signal-Desk-Portable.zip --repo ${{ github.repository }} --target ${{ github.sha }} --title "Signal Desk $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
